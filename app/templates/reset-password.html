{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block stylesheets %}
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/home.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center" style="color: white;">Reset Your Password</h2>
    
    <!-- Check for any flash messages (error or success) 
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="alert alert-info">
                {% for category, message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}-->
    
    <div id="reset-modal" class="other-modal">
        <div class="modal-content">
            <form action="{{ url_for('reset_password', token=token) }}" method="POST">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>

                <div class="btn-wrapper">
                    <button class="submit-btn" type="submit">Reset Password</button>
                </div>
        </div>
    </div>
</div>
{% endblock %}
