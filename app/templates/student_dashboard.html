<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKU CS Division Advising Center</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.css" rel="stylesheet">

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <!-- FontAwesome CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.13.1/css/all.css" rel="stylesheet">
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='students.css') }}">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar_default">
        <a class="navbar-brand" href="#" style="font-size: 40px;">WKU CS Advising Center</a>
        <!-- Hamburger Menu (Three Lines) -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('schedule_appointments') }}">Scheduled Appointments</a>
                </li>
            </ul>
        </div>
    </nav>
    

    <!-- Header Title -->
    <div class="title">
        <h2>Hello, Students! Book an appointment here.</h2>
    </div>

    <div class="container">
        <div class="list-group" id="advisor-container">
            <div id="advisor-title">
                Select an Advisor
            </div>
            <!-- Advisors will be populated here -->
        </div>
        
        <div id="calendar"></div>  
        <form id="appointmentForm">
  
    
        <div class="time_slots">
            <a class="advisor_time_slots" data-advisor-id="1">
                Select Times
            </a>
            <div id="time-slot-list">
                <!-- Time slots will be populated here dynamically -->
            </div>

            <p id="selected-date">Selected Date: </p> 
            <input type="hidden" id="student-email" value="{{ student_email }}">
            <input type="hidden" id="student-name" value="{{ student_name }}">
            <input type="hidden" id="student-last-name" value="{{ student_last_name}}">
            <input type="hidden" id="advisor-email" name="advisor_email">
            <input type="hidden" id="advisor-name" name="first_name">
            <input type="hidden" id="advisor-last" name="last_name">
            <input type="hidden" id="advisor-office" name="advisor-office">
        </div>
    </div>


    <div class="note-container">
        <input type="text" class="student-note" placeholder="Leave a note..." />
        <button id="submitAppointment" class="btn btn-primary">Submit</button>
    </div>
    

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='students.js') }}"></script>
</body>
</html>
