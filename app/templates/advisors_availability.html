<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKU CS Division Advising Center</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.css" rel="stylesheet">

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <!-- FontAwesome CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.13.1/css/all.css" rel="stylesheet">
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='advisors_availability.css') }}">
    <script src="{{ url_for('static', filename='advisors_availability.js') }}"></script>

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar_default">
        <a class="navbar-brand" href="#" style="font-size: 40px;">WKU CS Advising Center</a>
        <!-- Hamburger Menu (Three Lines) -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Header Title -->
    <div class="title">
        <h2>Hello, Advisors! Add your availability here.</h2>
    </div>

    <div class="container">
        <div class="time_slots">
            <a class="advisor_time_slots" data-advisor-id="1">
                Select Times
            </a>
            <div id="time-slot-list">
                <!-- Time slots will be populated here dynamically -->
            </div>
            <div id="selected-date"></div>
            <input type="hidden" id="advisor-email" value="{{ current_user.email }}" />


            
            <div class="submit-availability-container">
                <button id="submitAvailability" class="btn btn-primary">Submit</button>
            </div>
        </div>
    
        
        <div id="advisors_calendar"></div>
              
    </div>    
    
    <footer>
        <div class="footer-container">
            <div class="footer-left">
                <p>Western Kentucky University, 1906 College Heights Blvd
                Bowling Green, KY 42101</p>
                <p>guangming.xing@wku.edu</p>
                <p>270-745-8848</p>
            </div>
            <div class="footer-right">
                <li class="nav-item">
                    <a class="nav-link-footer-right" href="{{ url_for('home') }}">Logout</a>
                </li>
                
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
