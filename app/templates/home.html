{% extends "base.html" %}

{% block title %}{{ gettext('Home') }}{% endblock %}

{% block stylesheets %}
    <!-- Specific stylesheet for this page -->
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/home.css') }}">
{% endblock %}

{% block content %}
<div class="container" id="home-container">


    <div class="branding" id="branding">
        <img class="logo" src="https://apply-wku-edu.cdn.technolutions.net/images/wku-logo-no-cupola.svg" alt="WKU Logo">
        <h1 class="title">{{ gettext('Advising Portal') }}</h1>
        
    </div>

    <div id="login-modal" class="login-modal">
        <div class="modal-content">
            <form action="{{ url_for('login') }}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">{{ gettext('Topper Email') }}</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">{{ gettext('Password') }}</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <small class="form-text">
                        <a href="{{ url_for('forgot_password') }}" class="forgot-password-link">{{ gettext('Forgot Password?') }}</a>
                    </small>
                </div>
                <div class="btn-wrapper">
                    <button class="submit-btn" type="submit">{{ gettext('Login') }}</button>
                </div>
        </div>
    </div>

    
</div>

<a class="login-btn" id="login-btn" href="#">{{ gettext('Login') }}</a>

{% endblock %}

{% block scripts %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('login-btn').addEventListener('click', function (e) {
                e.preventDefault();
                document.getElementById('branding').style.display = 'none';
                document.getElementById('login-modal').style.display = 'block';
                document.getElementById('login-btn').style.display = 'none';
            });
        });
    </script>

{% endblock %}
